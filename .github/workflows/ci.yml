name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # The database tiers (test-plan.md §5 "testy bazy", rollout phase 3): pgTAP
  # (`npm run test:db`) and routes called against a real local stack with two
  # signed-in teachers (`npm run test:db:api`, §6.3).
  #
  # Advisory, like `content-safety-gate` below - branch protection is not
  # available on this plan, so a red `db` cannot stop a merge; a human reading
  # the check is its only enforcement. A separate job rather than steps in `ci`:
  # it needs Docker and the local stack but no repository secrets and no build,
  # and a red database suite should carry its own badge instead of hiding
  # behind a red lint.
  #
  # The stack comes from `.github/actions/supabase-stack` (Postgres pin, `-x`
  # list, image cache). This is the only job that saves the images: `pg_prove`
  # is pulled by `npm run test:db`, so only after the tests here is the set
  # complete. GitHub drops an entry after 7 days unused, and a miss pulls from
  # public.ecr.aws again: a red pull after a quiet week is fixed by re-running.
  db:
    runs-on: ubuntu-latest
    # A green run takes under 3 min; this caps a hung image pull or `start`.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - id: stack
        uses: ./.github/actions/supabase-stack
      - run: npm run test:db
      - run: npm run test:db:api
      - if: steps.stack.outputs.cache-hit != 'true'
        uses: ./.github/actions/supabase-stack/save
        with:
          cache-key: ${{ steps.stack.outputs.cache-key }}

  # The whole Playwright suite, with its own badge: a red browser run says
  # something else than a red database tier, and `db` already owns the image
  # cache. No repository secrets, so it also runs on PRs from forks: the keys are
  # the throwaway ones of this run's local stack, and `astro.config.e2e.mjs`
  # sends every model call to `tests/e2e/support/llm-stub.mjs`, so
  # `OPENROUTER_API_KEY` below is a placeholder no provider ever sees.
  #
  # `.dev.vars` is written here because that is what the app reads under
  # workerd: Playwright's `webServer.env` never reaches it. `CONTACT_TO` stays
  # empty, so no mail leaves the runner; the keys are Turnstile's always-pass
  # test keys. No `paths:` filter: a job skipped that way leaves a required check
  # pending forever.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - uses: ./.github/actions/supabase-stack
      - name: Write the app's local configuration
        run: |
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$PUBLISHABLE_KEY"
            echo "OPENROUTER_API_KEY=e2e-stub"
            echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "CONTACT_TO="
          } > .dev.vars
      - name: Point the tests at the local stack
        run: |
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "E2E_PASSWORD=e2e-test-password"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Advisory, not blocking — branch protection needs GitHub Pro or a public repo
  # (`gh api …/branches/master/protection` → 403), so this cannot stop a merge.
  # Its only enforcement is a human reading the check before clicking merge
  # (test-plan.md §5). A separate job, not a step in `ci` above: it needs its own
  # `OPENROUTER_API_KEY` secret and must never run on every push - only when a
  # prompt, the model allow-list, or the safety machinery itself changes.
  #
  # Path filter: everything that changes what the gate grades or how - prompts
  # and schemas, the model allow-list, the judge and report
  # (`content-safety*`), the calibration fixtures and refine cases, the retry
  # policy (`gate-*`), the generator that builds and parses every call
  # (`activity-generator.ts`), its error categories, the counts the judge
  # checks (`day-plan-limits.ts`) and the gate config. The same expression is
  # `FULL_MATRIX` in `gate-scope.ts`; `gate-scope.test.ts` fails when the two
  # drift. Resumed on 2026-10-03
  # (`content-safety-gate-resume`); every run of a change goes to that
  # change's `gate-runs.md` (test-plan.md §6.5).
  #
  # Cost, cut on 2026-10-03: a two-stage judge (Haiku screens, Sonnet decides
  # only what Haiku flags), one calibration per run, and the mode scope below.
  # The step summary prints generation and judge cost separately.
  content-safety-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # A green local run takes ~3 min (calibration + matrix); the matrix test
    # alone has a 10 min ceiling, plus calibration and install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for gate-relevant changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE \
            '^src/lib/services/prompts/.*\.(pl\.md|schema\.json)$|^src/lib/services/allowed-models\.ts$|^src/lib/services/content-safety|^src/lib/services/__fixtures__/content-safety\.ts$|^src/lib/services/gate-|^src/lib/services/activity-generator\.ts$|^src/lib/services/generation-error\.ts$|^src/lib/day-plan-limits\.ts$|^vitest\.gate\.config\.ts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.run == 'true'
      - run: npx astro sync
        if: steps.changes.outputs.run == 'true'
      # The PR's changed files narrow the matrix to the modes a changed prompt
      # feeds; anything else the filter above matches means the full matrix
      # (`src/lib/services/gate-scope.ts`). Every allowed model, always.
      - name: npm run test:gate
        if: steps.changes.outputs.run == 'true'
        run: |
          export GATE_CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          npm run test:gate
        # Only the key the gate calls with. `SUPABASE_*` are optional in
        # `astro.config.mjs` and the gate never reaches the database.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
