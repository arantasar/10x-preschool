name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # The database tiers (test-plan.md §5 "testy bazy", rollout phase 3): pgTAP
  # (`npm run test:db`) and routes called against a real local stack with two
  # signed-in teachers (`npm run test:db:api`, §6.3).
  #
  # Advisory, like `content-safety-gate` below - branch protection is not
  # available on this plan, so a red `db` cannot stop a merge; a human reading
  # the check is its only enforcement. A separate job rather than steps in `ci`:
  # it needs Docker and the local stack but no repository secrets and no build,
  # and a red database suite should carry its own badge instead of hiding
  # behind a red lint.
  #
  # `-x` leaves Postgres, GoTrue, PostgREST and Kong - what the two tiers use.
  # `supabase/seed.sql` does not exist; `db.seed` is enabled in config.toml and
  # the CLI skips a missing seed file.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # The CLI picks the Postgres image from supabase/.temp/postgres-version,
      # which `supabase link` writes locally with production's version and
      # .gitignore keeps out of the repo. Without it CI gets the CLI's own
      # default (17.6.1.106 on CLI 2.98.2), and that image crashed the server
      # ("server closed the connection unexpectedly") on day_plan_write's anon
      # call in this job's first run, while production's 17.6.1.127 passes.
      # Pinned to production's version so CI tests the Postgres that ships;
      # bump it when the linked project is upgraded.
      - name: Pin Postgres to the production version
        run: mkdir -p supabase/.temp && echo "17.6.1.127" > supabase/.temp/postgres-version
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # After `start`, before the tests. `-o env` prints KEY="value"; $GITHUB_ENV
      # would keep the quotes as part of the value, so they are stripped here.
      - name: Export the stack's URL and keys
        run: npx supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - run: npm run test:db
      - run: npm run test:db:api

  # Advisory, not blocking — branch protection needs GitHub Pro or a public repo
  # (`gh api …/branches/master/protection` → 403), so this cannot stop a merge.
  # Its only enforcement is a human reading the check before clicking merge
  # (test-plan.md §5). A separate job, not a step in `ci` above: it needs its own
  # `OPENROUTER_API_KEY` secret and must never run on every push - only when a
  # prompt, the model allow-list, or the safety machinery itself changes.
  #
  # SUSPENDED on 2026-09-19, on cost — see `src/lib/services/gate-suspension.ts`.
  # The change detection below is deliberately KEPT: a PR that touches a prompt
  # still gets a loud warning annotation saying the gate did not grade it. That
  # is the difference between a gate that is off and a gate that is gone, and it
  # is the whole reason this job was not simply deleted. Turning it back on is
  # two edits: set `RUN_CONTENT_SAFETY_GATE: "1"` in the env below and swap the
  # notice step back for `npm run test:gate`.
  content-safety-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for gate-relevant changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE \
            '^src/lib/services/prompts/.*\.(pl\.md|schema\.json)$|^src/lib/services/allowed-models\.ts$|^src/lib/services/content-safety|^vitest\.gate\.config\.ts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # No npm install, no model calls, no spend. Just the notice — which is the
      # point: this PR changed something the gate exists to grade, and nothing
      # graded it.
      - name: Report that the gate is suspended
        if: steps.changes.outputs.run == 'true'
        run: |
          NOTICE="Bramka bezpieczenstwa tresci jest ZAWIESZONA (decyzja 2026-09-19, koszt). Ten PR zmienia prompt, liste modeli albo sama bramke, i NIC tego nie ocenilo. Uruchom lokalnie: RUN_CONTENT_SAFETY_GATE=1 npm run test:gate"
          echo "::warning title=Content-safety gate suspended::$NOTICE"
          {
            echo "### ⚠️ Content-safety gate suspended"
            echo
            echo "$NOTICE"
            echo
            echo "Zmienione pliki objete bramka:"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E \
              '^src/lib/services/prompts/.*\.(pl\.md|schema\.json)$|^src/lib/services/allowed-models\.ts$|^src/lib/services/content-safety|^vitest\.gate\.config\.ts$' \
              | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
