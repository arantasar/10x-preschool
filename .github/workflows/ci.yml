name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Advisory, not blocking — branch protection needs GitHub Pro or a public repo
  # (`gh api …/branches/master/protection` → 403), so this cannot stop a merge.
  # Its only enforcement is a human reading the check before clicking merge
  # (test-plan.md §5). A separate job, not a step in `ci` above: it needs its own
  # `OPENROUTER_API_KEY` secret and must never run on every push - only when a
  # prompt, the model allow-list, or the safety machinery itself changes.
  #
  # SUSPENDED on 2026-09-19, on cost — see `src/lib/services/gate-suspension.ts`.
  # The change detection below is deliberately KEPT: a PR that touches a prompt
  # still gets a loud warning annotation saying the gate did not grade it. That
  # is the difference between a gate that is off and a gate that is gone, and it
  # is the whole reason this job was not simply deleted. Turning it back on is
  # two edits: set `RUN_CONTENT_SAFETY_GATE: "1"` in the env below and swap the
  # notice step back for `npm run test:gate`.
  content-safety-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for gate-relevant changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE \
            '^src/lib/services/prompts/.*\.(pl\.md|schema\.json)$|^src/lib/services/allowed-models\.ts$|^src/lib/services/content-safety|^vitest\.gate\.config\.ts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # No npm install, no model calls, no spend. Just the notice — which is the
      # point: this PR changed something the gate exists to grade, and nothing
      # graded it.
      - name: Report that the gate is suspended
        if: steps.changes.outputs.run == 'true'
        run: |
          NOTICE="Bramka bezpieczenstwa tresci jest ZAWIESZONA (decyzja 2026-09-19, koszt). Ten PR zmienia prompt, liste modeli albo sama bramke, i NIC tego nie ocenilo. Uruchom lokalnie: RUN_CONTENT_SAFETY_GATE=1 npm run test:gate"
          echo "::warning title=Content-safety gate suspended::$NOTICE"
          {
            echo "### ⚠️ Content-safety gate suspended"
            echo
            echo "$NOTICE"
            echo
            echo "Zmienione pliki objete bramka:"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E \
              '^src/lib/services/prompts/.*\.(pl\.md|schema\.json)$|^src/lib/services/allowed-models\.ts$|^src/lib/services/content-safety|^vitest\.gate\.config\.ts$' \
              | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
